name: Build Android APK + Release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble APK
        run: gradle -p . assembleDebug --no-daemon

      - name: Stage APK
        run: |
          mkdir -p dist
          APP_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle)
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          cp app/build/outputs/apk/debug/app-debug.apk "OSINT-Hub-v$APP_VERSION.apk"
          ls -la OSINT-Hub-v*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$APP_VERSION"
          gh release create "$TAG" "OSINT-Hub-v$APP_VERSION.apk" \
            --title "OSINT Hub $TAG" \
            --notes "Мобильная OSINT-консоль: умный поиск с автоопределением типа, IP-интел + rDNS, DNS-рекон и брутфорс поддоменов, email/phone/GitHub/EXIF, dork-конструктор, настройки (тема, страна, списки), история, диагностика. Установка: разрешите установку из неизвестных источников." \
          || gh release upload "$TAG" "OSINT-Hub-v$APP_VERSION.apk" --clobber

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: OSINT-Hub-APK
          path: OSINT-Hub-v*.apk
