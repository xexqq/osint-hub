name: Build Android APK + Release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble APK
        run: gradle -p . assembleDebug --no-daemon

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk OSINT-Hub-debug.apk
          ls -la OSINT-Hub-debug.apk

      - name: Publish to releases (v1.0.0)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 OSINT-Hub-debug.apk \
            --title "OSINT Hub APK v1.0.0" \
            --notes "Android-консоль OSINT: DoH DNS-recon + брутфорс поддоменов, IP-интел (ipwho.is), GitHub-разведка, EXIF фото, разбор телефонов (libphonenumber), dork-конструктор. Установка: разрешить установку из неизвестных источников." \
          || gh release upload v1.0.0 OSINT-Hub-debug.apk --clobber

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: OSINT-Hub-APK
          path: OSINT-Hub-debug.apk
